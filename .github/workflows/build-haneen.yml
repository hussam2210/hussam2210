name: Build Haneen APK V3.2
on:
  push:
    branches: [tmp-haneen-v32-final-build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null || true
      - name: Build APK
        working-directory: haneen-apk-build
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Al-Haneen-V3.2-dynamic-LAN
          path: haneen-apk-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
