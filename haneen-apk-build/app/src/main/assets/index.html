<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الحنين</title>
<style>
:root{--gold:#d5ab4c;--dark:#17191b;--cream:#f8f5ef;--muted:#777;--card:#fff;--danger:#b3261e}*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:var(--cream);color:#202124}button,input{font:inherit}.wrap{max-width:760px;margin:auto;padding:18px}.hidden{display:none!important}.brand{background:linear-gradient(145deg,#17191b,#25282b);color:white;border-radius:28px;padding:24px;box-shadow:0 18px 40px #0002}.logo{width:76px;height:76px;border:2px solid var(--gold);border-radius:22px;display:grid;place-items:center;font-size:42px;font-weight:900;color:var(--gold);margin-bottom:14px}.brand h1{margin:0 0 6px;font-size:28px}.brand p{margin:0;color:#c8c8c8}.panel{background:#fff;border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 7px 22px #0000000c}.field{width:100%;padding:15px;border:1px solid #ddd;border-radius:15px;margin:7px 0;background:white}.btn{border:0;border-radius:15px;padding:14px 18px;font-weight:700;cursor:pointer}.btn.primary{background:var(--gold);color:var(--dark)}.btn.dark{background:var(--dark);color:white}.btn.ghost{background:#eee}.full{width:100%}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1}.muted{color:var(--muted)}.error{color:var(--danger);margin:10px 0}.hero{background:var(--dark);color:white;border-radius:26px;padding:22px;margin-top:14px}.hero h2{margin:0 0 8px;font-size:27px}.search{display:flex;gap:8px;margin-top:14px}.search input{flex:1}.list{display:grid;gap:10px;margin-top:12px}.item{background:white;border-radius:18px;padding:15px;box-shadow:0 5px 14px #0000000b}.item h3{margin:0 0 7px;font-size:17px}.badge{display:inline-block;background:#f3ead2;color:#7c5a0b;border-radius:999px;padding:5px 9px;font-size:12px}.pricegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.value{background:white;border-radius:18px;padding:16px}.value b{display:block;color:#8b6511;font-size:20px;margin-top:5px}.top{position:sticky;top:0;background:rgba(248,245,239,.94);backdrop-filter:blur(8px);z-index:3;padding:8px 0}.tabs{display:flex;gap:8px}.tabs button{flex:1}.user{background:white;border-radius:18px;padding:14px;margin:9px 0}.perms{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.check{background:#f7f7f7;border-radius:12px;padding:8px}.overlay{position:fixed;inset:0;background:#000c;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}.scanner{background:#111;color:white;border-radius:24px;padding:15px;width:min(94vw,520px)}video{width:100%;border-radius:18px;background:#000;aspect-ratio:3/4;object-fit:cover}.small{font-size:12px}@media(max-width:480px){.wrap{padding:12px}.pricegrid{grid-template-columns:1fr}.brand h1{font-size:25px}}
</style>
</head>
<body>
<div id="login" class="wrap">
  <div class="brand"><div class="logo">H</div><h1>شركة الحنين التجارية</h1><p>Inventory & Pricing System</p></div>
  <div class="panel"><input id="lu" class="field" placeholder="اسم المستخدم" autocomplete="username"><input id="lp" class="field" type="password" placeholder="كلمة المرور" autocomplete="current-password"><div id="loginErr" class="error"></div><button class="btn primary full" onclick="login()">تسجيل الدخول</button><p class="muted small">DR.Pixel Sync • 192.168.10.8:8787</p></div>
</div>

<div id="app" class="wrap hidden">
  <div class="top"><div class="row between"><div><b style="font-size:24px">الحنين</b><div id="hello" class="muted"></div></div><button class="btn ghost" onclick="logout()">خروج</button></div></div>
  <div id="homeView">
    <div class="hero"><h2>أعمالك، بوضوح أكبر.</h2><div style="color:#ccc">استعرض المواد والأسعار والكميات مباشرة من نظام الشركة.</div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="openScanner()">مسح باركود</button><button id="usersBtn" class="btn ghost hidden" onclick="showUsers()">المستخدمون</button></div></div>
    <div class="panel"><div class="row between"><b>حالة المزامنة</b><span id="health" class="badge">...</span></div><div id="totalProducts" class="muted" style="margin-top:8px"></div></div>
    <div class="search"><input id="q" class="field" placeholder="ابحث بالاسم أو الكود أو الباركود" onkeyup="if(event.key==='Enter')loadProducts()"><button class="btn dark" onclick="loadProducts()">بحث</button></div>
    <div class="row between"><h2>المواد</h2><span id="count" class="muted"></span></div><div id="products" class="list"></div>
  </div>
  <div id="detailView" class="hidden"></div>
  <div id="usersView" class="hidden"></div>
</div>

<div id="scanOverlay" class="overlay hidden"><div class="scanner"><div class="row between"><b>مسح الباركود</b><button class="btn ghost" onclick="closeScanner()">إغلاق</button></div><video id="video" autoplay playsinline muted></video><p id="scanMsg">وجّه الكاميرا نحو الباركود</p><div class="row"><input id="manualBarcode" class="field grow" placeholder="أو أدخل الباركود"><button class="btn primary" onclick="lookupBarcode(document.getElementById('manualBarcode').value)">بحث</button></div></div></div>

<script>
const API='http://192.168.10.8:8787';let token='',me=null,scanTimer=null,stream=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{});if(token)opt.headers.Authorization='Bearer '+token;const r=await fetch(API+path,opt);let data=null;try{data=await r.json()}catch{}if(!r.ok)throw new Error(data?.error||('HTTP '+r.status));return data}
async function login(){try{$('loginErr').textContent='';const d=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('lu').value.trim(),password:$('lp').value})});token=d.token;me=d.user;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('hello').textContent='أهلاً، '+me.name;if(me.role==='admin')$('usersBtn').classList.remove('hidden');await refreshHealth();await loadProducts()}catch(e){$('loginErr').textContent=e.message}}
function logout(){token='';me=null;$('app').classList.add('hidden');$('login').classList.remove('hidden')}
async function refreshHealth(){try{const h=await api('/api/health');$('health').textContent=h.lastError?'تنبيه':'متصل';$('totalProducts').textContent='إجمالي المواد في Phenix: '+h.products+(h.lastError?' • '+h.lastError:'')}catch(e){$('health').textContent='غير متصل';$('totalProducts').textContent=e.message}}
async function loadProducts(){try{showHome();$('products').innerHTML='<div class="muted">جاري التحميل...</div>';const q=$('q').value.trim();const a=await api('/api/products'+(q?'?q='+encodeURIComponent(q):''));$('count').textContent=a.length+(q?' نتيجة':' مادة ظاهرة');$('products').innerHTML=a.map((p,i)=>`<div class="item" onclick='showProduct(${JSON.stringify(i)})' data-i="${i}"><h3>${esc(p.name)}</h3><div class="muted">${esc(p.code)} ${p.category?' • '+esc(p.category):''}</div>${p.quantity==null?'':`<div class="badge" style="margin-top:8px">${esc(fmt(p.quantity))} ${esc(p.unit)}</div>`}</div>`).join('');window.currentProducts=a}catch(e){$('products').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function fmt(v){const n=Number(v);return Number.isInteger(n)?String(n):n.toFixed(2)}function money(v){return Number(v).toFixed(2)+' USD'}
function showHome(){$('homeView').classList.remove('hidden');$('detailView').classList.add('hidden');$('usersView').classList.add('hidden')}
function showProduct(i){const p=window.currentProducts[i];let vals='';[['الكمية الإجمالية',p.quantity==null?null:fmt(p.quantity)+' '+p.unit],['سعر مفرق',p.retail==null?null:money(p.retail)],['سعر جملة',p.wholesale==null?null:money(p.wholesale)],['سعر جملة جملة',p.bulk==null?null:money(p.bulk)],['سعر الصادر',p.export==null?null:money(p.export)]].forEach(x=>{if(x[1]!=null)vals+=`<div class="value"><span>${x[0]}</span><b>${esc(x[1])}</b></div>`});$('homeView').classList.add('hidden');$('usersView').classList.add('hidden');$('detailView').classList.remove('hidden');$('detailView').innerHTML=`<button class="btn ghost" onclick="showHome()">رجوع</button><div class="hero"><div style="color:var(--gold)">${esc(p.category)}</div><h2>${esc(p.name)}</h2><div style="color:#bbb">${esc(p.code)} ${p.barcode?' • '+esc(p.barcode):''}</div></div><h2>التفاصيل</h2><div class="pricegrid">${vals}</div>`}
async function lookupBarcode(code){code=String(code||'').trim();if(!code)return;try{const p=await api('/api/products/barcode/'+encodeURIComponent(code));closeScanner();window.currentProducts=[p];showProduct(0)}catch(e){$('scanMsg').textContent=e.message}}
async function openScanner(){$('scanOverlay').classList.remove('hidden');$('scanMsg').textContent='وجّه الكاميرا نحو الباركود';try{if(!navigator.mediaDevices?.getUserMedia||!('BarcodeDetector' in window))throw new Error('الكاميرا التلقائية غير مدعومة هنا؛ أدخل الباركود يدوياً.');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});$('video').srcObject=stream;const detector=new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','upc_a','upc_e','qr_code']});scanTimer=setInterval(async()=>{try{const codes=await detector.detect($('video'));if(codes.length){clearInterval(scanTimer);scanTimer=null;await lookupBarcode(codes[0].rawValue)}}catch{}},500)}catch(e){$('scanMsg').textContent=e.message}}
function closeScanner(){if(scanTimer){clearInterval(scanTimer);scanTimer=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').srcObject=null;$('scanOverlay').classList.add('hidden')}
async function showUsers(){try{$('homeView').classList.add('hidden');$('detailView').classList.add('hidden');$('usersView').classList.remove('hidden');const a=await api('/api/users');$('usersView').innerHTML=`<div class="row between"><button class="btn ghost" onclick="showHome()">رجوع</button><button class="btn primary" onclick="addUser()">إضافة مستخدم</button></div><h2>المستخدمون</h2><div id="userList"></div>`;$('userList').innerHTML=a.map(u=>userCard(u)).join('')}catch(e){alert(e.message)}}
function userCard(u){if(u.role==='admin')return `<div class="user"><b>${esc(u.name)}</b><div class="muted">${esc(u.username)} • admin</div></div>`;const p=u.permissions||{};return `<div class="user" data-user="${u.id}"><div class="row between"><div><b>${esc(u.name)}</b><div class="muted">${esc(u.username)} • ${esc(u.role)}</div></div><label>فعال <input class="act" type="checkbox" ${u.active?'checked':''}></label></div><div class="perms">${check('quantity','الكمية',p.quantity)}${check('retail','مفرق',p.retail)}${check('wholesale','جملة',p.wholesale)}${check('bulk','جملة جملة',p.bulk)}${check('export','صادر',p.export)}</div><button class="btn dark" style="margin-top:10px" onclick="saveUser('${u.id}')">حفظ</button></div>`}
function check(k,t,v){return `<label class="check"><input data-p="${k}" type="checkbox" ${v?'checked':''}> ${t}</label>`}
async function saveUser(id){const el=document.querySelector(`[data-user="${id}"]`);const p={};el.querySelectorAll('[data-p]').forEach(x=>p[x.dataset.p]=x.checked);try{await api('/api/users/'+id+'/permissions',{method:'PATCH',body:JSON.stringify({permissions:p,active:el.querySelector('.act').checked})});await showUsers()}catch(e){alert(e.message)}}
async function addUser(){const name=prompt('الاسم');if(!name)return;const username=prompt('اسم المستخدم');if(!username)return;const password=prompt('كلمة المرور (6 أحرف على الأقل)');if(!password)return;const role=confirm('هل هو مندوب؟\nموافق = representative\nإلغاء = worker')?'representative':'worker';try{await api('/api/users',{method:'POST',body:JSON.stringify({name,username,password,role,permissions:{quantity:true,retail:true,wholesale:true,bulk:true,export:true}})});await showUsers()}catch(e){alert(e.message)}}
</script>
</body></html>
